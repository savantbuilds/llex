[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llex"
version = "0.2.0"
description = "LLex (Local Language Expression Engine) is a local-first, paginated word processor with a pluggable local LLM assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Savant Pseudoist" }]
keywords = ["word-processor", "editor", "tiptap", "prosemirror", "local-llm", "pywebview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors :: Word Processors",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pywebview>=5.0",
    "odfpy>=1.4.1",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/savantpseudoist/llex"
Issues = "https://github.com/savantpseudoist/llex/issues"

[project.scripts]
llex = "llex.main:main"

[tool.setuptools]
# The package lives at the repository root, not under a nested `llex/llex`
# directory. `static` and `templates` hold data, not importable code, but they
# must still be listed: setuptools treats any directory named in
# `package-data` as a package and warns if it is not declared here.
packages = [
    "llex",
    "llex.static",
    "llex.static.js",
    "llex.templates",
]

[tool.setuptools.package-data]
llex = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.map",
    # The editor sources the bundle is built from. Shipped so `npm run build`
    # works against an installed wheel, not just a source checkout.
    "static/js/*.js",
]

[tool.pytest.ini_options]
markers = [
  "e2e: boots the real server and the real front-end bundle; needs node and npm ci",
]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Warnings are errors by default so a deprecation cannot slip through
# unnoticed. The exceptions are all third-party notices we do not control.
filterwarnings = [
    "error",
    # Starlette asks for `httpx2`; `httpx` is what TestClient actually uses.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["llex"]
omit = ["llex/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["llex", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    # `datetime.UTC` only exists on 3.11+, and we support 3.10.
    "UP017",
    # Long lines in SQL/HTML-ish string literals are unavoidable.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on exception paths and use assertions.
"tests/*" = ["S101", "S105", "S106"]
# The end-to-end test must fetch from a loopback server and shell out to node.
# Both are controlled by the test itself, not by untrusted input.
"tests/test_editor_boot.py" = ["S310", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["llex"]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
files = ["llex"]
strict = true
warn_unreachable = true
pretty = true
# pywebview and Qt-less webview backends ship without type information.
[[tool.mypy.overrides]]
module = ["webview.*", "uvicorn.*", "docx.*", "odf.*"]
ignore_missing_imports = true
